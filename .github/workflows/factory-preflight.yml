name: Factory Python checks

on:
  push:
    branches:
      - 'factory/**'
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI dependency
        run: python -m pip install 'requests>=2.31,<3' 'jsonschema>=4.22,<5'
      - name: Compile Python source
        run: python -m compileall -q polyup factory tests
      - name: Offline preflight tests
        run: python -m unittest discover -s tests -v
